<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Profile Card</title>
    <!-- Linking external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <div class="image-placeholder">
            <!-- Simulated User Avatar Icon -->
            <span>👤</span>
        </div>
        <h2 class="profile-name">Alex Morgan</h2>
        <p class="profile-title">Frontend Developer</p>
        <p class="profile-bio">
            Passionate about building responsive, modern user interfaces using semantic HTML and clean CSS.
        </p>
        <button class="profile-btn">Connect</button>
    </div>

</body>
</html>
